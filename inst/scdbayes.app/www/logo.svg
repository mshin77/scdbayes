<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <!-- Phase change vertical dashed line -->
  <line x1="42" y1="4" x2="42" y2="56" stroke="#0c1f4a" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>

  <!-- Baseline (A) phase - flat/low data with connecting lines -->
  <polyline points="6,38 14,42 22,36 30,40 38,37" fill="none" stroke="#337ab7" stroke-width="2"/>
  <circle cx="6" cy="38" r="3" fill="#337ab7"/>
  <circle cx="14" cy="42" r="3" fill="#337ab7"/>
  <circle cx="22" cy="36" r="3" fill="#337ab7"/>
  <circle cx="30" cy="40" r="3" fill="#337ab7"/>
  <circle cx="38" cy="37" r="3" fill="#337ab7"/>

  <!-- Treatment (B) phase - stepped up data with connecting lines -->
  <polyline points="46,16 54,12 62,18 70,10 78,14" fill="none" stroke="#0c1f4a" stroke-width="2"/>
  <circle cx="46" cy="16" r="3" fill="#0c1f4a"/>
  <circle cx="54" cy="12" r="3" fill="#0c1f4a"/>
  <circle cx="62" cy="18" r="3" fill="#0c1f4a"/>
  <circle cx="70" cy="10" r="3" fill="#0c1f4a"/>
  <circle cx="78" cy="14" r="3" fill="#0c1f4a"/>

  <!-- Phase labels -->
  <text x="20" y="55" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#337ab7" text-anchor="middle" font-weight="600">A</text>
  <text x="62" y="55" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#0c1f4a" text-anchor="middle" font-weight="600">B</text>

  <!-- App name -->
  <text x="96" y="40" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5" fill="#0c1f4a">scdbayes</text>
</svg>
